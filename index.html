<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelavond Planner 🎲</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1208;
      --surface:   #261b0e;
      --surface2:  #31230f;
      --gold:      #d4a030;
      --gold-light:#f0c060;
      --cream:     #f5ead8;
      --muted:     #8a7060;
      --felt:      #2d5a2d;
      --felt2:     #1e3e1e;
      --red:       #8b2020;
      --radius:    16px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.6;
    }

    header {
      text-align: center;
      padding: 56px 24px 40px;
      position: relative;
      z-index: 1;
    }

    .header-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 6px 18px;
      border-radius: 40px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900;
      color: var(--cream);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    h1 span { color: var(--gold); }

    .subtitle { font-size: 1rem; color: var(--muted); font-weight: 300; }

    .gold-line {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px auto 0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
      position: relative; z-index: 1;
    }

    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(212,160,48,0.2);
      border-radius: var(--radius);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .panel-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }

    .date-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }

    .date-tab {
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(212,160,48,0.3);
      background: transparent;
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .date-tab:hover { border-color: var(--gold); color: var(--gold); }
    .date-tab.active { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 700; }

    .table-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .table-wrap { position: relative; width: 260px; height: 260px; }

    .felt-table {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      background: radial-gradient(circle at 40% 35%, var(--felt), var(--felt2));
      border-radius: 50%;
      border: 4px solid #4a7a4a;
      box-shadow: 0 0 0 6px #1a2e1a, 0 8px 32px rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }

    .felt-table-inner {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(255,255,255,0.35);
      text-align: center; line-height: 1.4;
    }

    .chair { position: absolute; width: 52px; height: 52px; }

    .chair-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(212,160,48,0.3);
      background: var(--surface2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; transition: all 0.3s;
    }

    .chair-inner.bezet {
      border-color: var(--gold);
      background: linear-gradient(135deg, #2a1f0a, #3d2c0e);
      box-shadow: 0 0 12px rgba(212,160,48,0.3);
    }

    .chair-inner.nieuw { animation: newSeat 0.5s ease; }

    @keyframes newSeat {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .chair-icon { font-size: 1.4rem; line-height: 1; }

    .chair-name {
      font-size: 0.5rem; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--gold);
      max-width: 46px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .chair-spel {
      font-size: 0.42rem; color: var(--muted);
      max-width: 46px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .seats-count { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .seats-count span { color: var(--gold-light); font-weight: 700; }
    .no-date-msg { text-align: center; padding: 20px; color: var(--muted); font-size: 0.85rem; }

    .form-group { margin-bottom: 18px; }

    label {
      display: block; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 8px;
    }

    input, select {
      width: 100%; padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid rgba(212,160,48,0.2);
      border-radius: 10px; color: var(--cream);
      font-family: 'Lato', sans-serif; font-size: 0.95rem;
      transition: border-color 0.2s; -webkit-appearance: none;
    }

    input:focus, select:focus { outline: none; border-color: var(--gold); }
    input::placeholder { color: var(--muted); }
    select option { background: var(--surface2); }
    .custom-spel-wrap { margin-top: 10px; }

    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--gold), #b8861e);
      border: none; border-radius: 10px;
      color: var(--bg); font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,160,48,0.3); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface); border: 1px solid var(--gold);
      border-radius: 12px; padding: 14px 28px;
      font-size: 0.95rem; color: var(--cream);
      z-index: 100; transition: transform 0.4s cubic-bezier(.175,.885,.32,1.275);
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--red); }

    .loader {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(212,160,48,0.3);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="header-badge">🎲 Bordspellenavond</div>
  <h1>Wie schuift er<br><span>mee aan tafel?</span></h1>
  <p class="subtitle">Schrijf je in en kies een spelletjesavond</p>
  <div class="gold-line"></div>
</header>

<main>
  <section class="panel">
    <h2 class="panel-title">Beschikbare avonden</h2>
    <p class="panel-sub" id="overzicht-sub">Kies een datum om de stoelen te bekijken</p>
    <div class="date-tabs" id="dateTabs">
      <span style="color:var(--muted);font-size:.85rem">Laden<span class="loader"></span></span>
    </div>
    <div id="tafelView" class="table-container">
      <div class="no-date-msg">← Kies een datum hierboven</div>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Inschrijven</h2>
    <p class="panel-sub">Vul je gegevens in en reserveer je stoel</p>

    <div class="form-group">
      <label for="naam">Jouw naam</label>
      <input type="text" id="naam" placeholder="Voornaam of bijnaam" maxlength="40" />
    </div>

    <div class="form-group">
      <label for="datumKeuze">Datum</label>
      <select id="datumKeuze">
        <option value="">— Kies een datum —</option>
      </select>
    </div>

    <div class="form-group">
      <label for="spelKeuze">Spel</label>
      <select id="spelKeuze">
        <option value="">— Kies een spel —</option>
        <option value="__custom__">✏️ Zelf invullen…</option>
      </select>
      <div class="custom-spel-wrap" id="customSpelWrap" style="display:none">
        <input type="text" id="customSpel" placeholder="Naam van het spel" maxlength="60" />
      </div>
    </div>

    <button class="btn" id="inschrijfBtn" onclick="inschrijven()">
      Reserveer mijn stoel 🪑
    </button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwUXbjt_GhCZ8zKn10WJmearsqempa-FIyNIiWmLVKktuXqoIcGZ66mwWixv6Ffmg50Qg/exec";

let inschrijvingen = {};
let beschikbareDatums = [];
let geselecteerdeDatum = null;

function formatDatum(str) {
  const d = new Date(str + "T00:00:00");
  return d.toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long" });
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toonToast(msg, fout = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (fout ? " error" : "") + " show";
  setTimeout(() => t.classList.remove("show"), 3500);
}

async function apiFetch(actie) {
  const res = await fetch(API_URL + "?actie=" + actie);
  return res.json();
}

async function laadAlles() {
  // Laad spellen
  try {
    const data = await apiFetch("getSpellen");
    if (data.succes && data.spellen) {
      const sel = document.getElementById("spelKeuze");
      data.spellen.forEach(spel => {
        const opt = document.createElement("option");
        opt.value = spel;
        opt.textContent = spel;
        sel.insertBefore(opt, sel.lastElementChild);
      });
    }
  } catch(e) { console.warn("Spellen laden mislukt:", e); }

  // Laad datums
  try {
    const data = await apiFetch("getDatums");
    if (data.succes && data.datums) {
      beschikbareDatums = data.datums;
    }
  } catch(e) { console.warn("Datums laden mislukt:", e); }

  // Laad inschrijvingen
  try {
    const data = await apiFetch("getInschrijvingen");
    if (data.succes) {
      inschrijvingen = data.datums || {};
      Object.keys(inschrijvingen).forEach(d => {
        if (!beschikbareDatums.includes(d)) beschikbareDatums.push(d);
      });
    }
  } catch(e) { console.warn("Inschrijvingen laden mislukt:", e); }

  beschikbareDatums.sort();
  bouwDatumTabs();
  vulDatumSelect();
}

function bouwDatumTabs() {
  const container = document.getElementById("dateTabs");
  container.innerHTML = "";
  if (beschikbareDatums.length === 0) {
    container.innerHTML = `<span style="color:var(--muted);font-size:.85rem">Nog geen avonden gepland</span>`;
    return;
  }
  beschikbareDatums.forEach(datum => {
    const btn = document.createElement("button");
    btn.className = "date-tab";
    btn.dataset.datum = datum;
    const d = new Date(datum + "T00:00:00");
    btn.textContent = d.toLocaleDateString("nl-BE", { day: "numeric", month: "short" });
    btn.onclick = () => selecteerDatum(datum);
    container.appendChild(btn);
  });
}

function vulDatumSelect() {
  const sel = document.getElementById("datumKeuze");
  sel.innerHTML = '<option value="">— Kies een datum —</option>';
  beschikbareDatums.forEach(datum => {
    const opt = document.createElement("option");
    opt.value = datum;
    opt.textContent = formatDatum(datum);
    sel.appendChild(opt);
  });
}

function selecteerDatum(datum) {
  geselecteerdeDatum = datum;
  document.querySelectorAll(".date-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.datum === datum);
  });
  document.getElementById("datumKeuze").value = datum;
  tekenTafel(datum);
}

function tekenTafel(datum) {
  const view = document.getElementById("tafelView");
  const sub = document.getElementById("overzicht-sub");
  const deelnemers = inschrijvingen[datum] || [];
  const vrij = 6 - deelnemers.length;
  sub.textContent = formatDatum(datum);
  const midden = 130; // helft van 260px
  const straal = 95;  // afstand van centrum naar stoel
  const stoelHTML = [0,1,2,3,4,5].map(i => {
    const hoek = (i * 60 - 90) * Math.PI / 180; // start bovenaan, elke 60°
    const x = midden + straal * Math.cos(hoek) - 26; // -26 = helft stoelbreedte
    const y = midden + straal * Math.sin(hoek) - 26;
    const p = deelnemers[i];
    return p
      ? `<div class="chair" style="left:${x}px;top:${y}px"><div class="chair-inner bezet">
           <span class="chair-icon">🧑</span>
           <span class="chair-name">${escHtml(p.naam)}</span>
           <span class="chair-spel">${escHtml(p.spel)}</span>
         </div></div>`
      : `<div class="chair" style="left:${x}px;top:${y}px"><div class="chair-inner"><span class="chair-icon" style="opacity:.3">🪑</span></div></div>`;
  }).join("");

  view.innerHTML = `
    <div class="table-wrap">
      <div class="felt-table"><div class="felt-table-inner">Speel<br>avond</div></div>
      ${stoelHTML}
    </div>
    <div class="seats-count"><span>${deelnemers.length}</span>/6 bezet · <span>${vrij}</span> vrij</div>
  `;
}

async function inschrijven() {
  const naam = document.getElementById("naam").value.trim();
  const datum = document.getElementById("datumKeuze").value;
  const spelSel = document.getElementById("spelKeuze").value;
  const spelCustom = document.getElementById("customSpel").value.trim();
  const spel = spelSel === "__custom__" ? spelCustom : spelSel;

  if (!naam) return toonToast("Vul je naam in.", true);
  if (!datum) return toonToast("Kies een datum.", true);
  if (!spel) return toonToast("Kies of vul een spel in.", true);

  const btn = document.getElementById("inschrijfBtn");
  btn.disabled = true;
  btn.innerHTML = "Bezig… <span class='loader'></span>";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ naam, datum, spel }),
    });
    const data = await res.json();
    if (data.succes) {
      toonToast("🎉 " + data.bericht);
      if (!inschrijvingen[datum]) inschrijvingen[datum] = [];
      inschrijvingen[datum].push({ naam, spel });
      tekenTafel(datum);
      const stoelen = document.querySelectorAll(".chair-inner");
      const idx = inschrijvingen[datum].length - 1;
      if (stoelen[idx]) stoelen[idx].classList.add("nieuw");
      document.getElementById("naam").value = "";
      document.getElementById("spelKeuze").value = "";
      document.getElementById("customSpelWrap").style.display = "none";
    } else {
      toonToast(data.fout || "Inschrijving mislukt.", true);
    }
  } catch(e) {
    toonToast("Verbindingsfout. Probeer opnieuw.", true);
  }

  btn.disabled = false;
  btn.innerHTML = "Reserveer mijn stoel 🪑";
}

document.getElementById("spelKeuze").addEventListener("change", e => {
  document.getElementById("customSpelWrap").style.display =
    e.target.value === "__custom__" ? "block" : "none";
});

document.getElementById("datumKeuze").addEventListener("change", e => {
  if (e.target.value) selecteerDatum(e.target.value);
});

laadAlles();
</script>
</body>
</html>
